<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fieldwork — spatial workspace</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><style>
:root{
  --ink:#0B0F16;
  --ink2:#121A26;
  --ink3:#172233;
  --line:#283346;
  --paper:#ECE5D6;
  --dim:#8D97A8;
  --sig:#F0B44C;   /* signal / focal highlight */
  --sense:#7FB0DA; /* geometry / camera / sensors */
  --earth:#D27A45; /* clock / grounding */
  --haze:#B486E6;  /* transforms / reveals */
  --ok:#5CCB8A;    /* active / verified */
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--body);
  overflow:hidden;
  user-select:auto;
}

/* Stage & World */
#stage{position:fixed;inset:0;overflow:hidden;cursor:default;touch-action:none}
#stage.explore{cursor:grab}
#stage.explore.drag{cursor:grabbing}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#macro{position:absolute;left:-14000px;top:-14000px;width:28000px;height:28000px;overflow:visible;pointer-events:none}

/* Drafting Boards */
.board{
  position:absolute;
  width:1600px;
  height:900px;
  transform-origin:800px 450px;
  background:radial-gradient(ellipse at 50% 45%, #121B29, #0B0F16);
  border:1px solid rgba(40,51,70,.85);
  border-radius:14px;
  box-shadow:0 30px 100px rgba(0,0,0,.6);
}
.board.clickable{cursor:pointer}
.board.clickable:hover{border-color:var(--sig);box-shadow:0 0 0 2px rgba(240,180,76,.35),0 30px 100px rgba(0,0,0,.65)}
.board>svg{position:absolute;inset:0;width:1600px;height:900px;overflow:visible;pointer-events:none}
.board .h{position:absolute}

/* Architectural Corner Marks & Title Block */
.sheet-mark{position:absolute;width:28px;height:28px;border-color:var(--line);border-style:solid;border-width:0;pointer-events:none}
.tl{left:-7px;top:-7px;border-left-width:2px;border-top-width:2px}
.tr{right:-7px;top:-7px;border-right-width:2px;border-top-width:2px}
.bl{left:-7px;bottom:-7px;border-left-width:2px;border-bottom-width:2px}
.br{right:-7px;bottom:-7px;border-right-width:2px;border-bottom-width:2px}
.tblock{
  position:absolute;right:28px;bottom:20px;
  font:500 14px/1 var(--mono);color:var(--dim);
  letter-spacing:.14em;text-transform:uppercase;
  display:flex;gap:18px;border-top:1px solid var(--line);padding-top:10px;
  pointer-events:none;
}
.tblock b{color:var(--paper);font-weight:500}

/* Board Typography */
.eyebrow{left:84px;top:56px;font:500 17px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--sig)}
.h2{left:84px;top:88px;font:700 56px/1.04 var(--display);letter-spacing:-.02em;max-width:1180px;text-wrap:balance}
.txt{font:400 23px/1.38 var(--body);color:var(--paper)}
.small{font:400 18px/1.4 var(--body);color:var(--dim)}
.code{
  font:500 18px/1.45 var(--mono);
  background:var(--ink);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 18px;
  color:var(--paper);
}
.card{
  background:rgba(18,26,38,.92);
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:20px 22px;
  box-shadow:0 12px 32px rgba(0,0,0,.35);
}
.pill{
  display:inline-block;
  border:1.5px solid currentColor;
  border-radius:999px;
  padding:4px 12px;
  font:500 14px/1.1 var(--mono);
  letter-spacing:.1em;
  text-transform:uppercase;
}

/* SVG Styles */
svg text{font-family:var(--mono);fill:var(--paper)}
svg .t-lab{font:500 19px var(--mono);letter-spacing:.08em;text-transform:uppercase}
svg .t-sm{font:400 16px var(--mono);fill:var(--dim)}
svg .t-disp{font:700 28px var(--display)}
.stroke{fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-sig{stroke:var(--sig)}.s-sense{stroke:var(--sense)}.s-earth{stroke:var(--earth)}.s-haze{stroke:var(--haze)}.s-ok{stroke:var(--ok)}.s-line{stroke:var(--line)}.s-dim{stroke:var(--dim)}.s-paper{stroke:var(--paper)}
.f-sig{fill:var(--sig)}.f-sense{fill:var(--sense)}.f-earth{fill:var(--earth)}.f-haze{fill:var(--haze)}.f-ok{fill:var(--ok)}.f-ink{fill:var(--ink)}.f-ink2{fill:var(--ink2)}.f-paper{fill:var(--paper)}.f-dim{fill:var(--dim)}
.c-sig{color:var(--sig)}.c-sense{color:var(--sense)}.c-earth{color:var(--earth)}.c-haze{color:var(--haze)}.c-ok{color:var(--ok)}.c-dim{color:var(--dim)}

/* Reveal Vocabulary */
[data-c]{
  transition:
    opacity .65s ease,
    transform .9s cubic-bezier(.2,.9,.2,1),
    clip-path 1s cubic-bezier(.7,0,.2,1),
    stroke-dashoffset 1.3s cubic-bezier(.65,0,.25,1);
}
svg [data-c]{transform-box:fill-box;transform-origin:center}
.rv{opacity:0;transform:translateY(22px)}
.pop{opacity:0;transform:scale(.45)}
.pop.on{transition:opacity .38s ease, transform .75s cubic-bezier(.22,1,.36,1)}
.fade{opacity:0}
.slide{opacity:0;transform:translateX(-46px)}
.mask{clip-path:inset(-10% 100% -10% 0)}
.mask.on{clip-path:inset(-10% -4% -10% -4%)}
.draw{stroke-dasharray:1 1;stroke-dashoffset:1}
.draw.on{stroke-dashoffset:0}
path.draw[marker-end]:not(.on),path.draw[marker-start]:not(.on){opacity:0}
.on{opacity:1;transform:none}

/* Ambient Motion */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes breathe{50%{opacity:.4}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes dashflow{to{stroke-dashoffset:-40}}
.spin-slow{animation:spin 50s linear infinite;transform-box:fill-box;transform-origin:center}
.spin-rev{animation:spinr 36s linear infinite;transform-box:fill-box;transform-origin:center}
.breathe.on{animation:breathe 2.6s ease-in-out infinite}
.bob.on{animation:bob 3.2s ease-in-out infinite}
.flow{stroke-dasharray:8 12;animation:dashflow 1.4s linear infinite}

/* Top Telemetry / Hint Pill */
#hud{
  position:fixed;top:14px;left:16px;right:16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  pointer-events:none;z-index:5;
}
.pillbar{
  font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);
  background:rgba(18,26,38,.86);
  border:1px solid var(--line);
  padding:7px 12px;border-radius:999px;
  backdrop-filter:blur(6px);
  white-space:nowrap;
}
.pillbar b{color:var(--sig);font-weight:500}
#hint{transition:opacity .35s}
#hint.hide{opacity:0}

.btn{
  appearance:none;border:1px solid var(--line);
  background:var(--ink2);color:var(--paper);
  height:36px;min-width:36px;border-radius:8px;
  font:500 13px var(--mono);letter-spacing:.05em;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;padding:0 10px;
  transition:border-color .15s, color .15s;
}
.btn:hover{border-color:var(--dim)}
.btn:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.btn[aria-pressed="true"]{border-color:var(--sig);color:var(--sig)}

/* Camera interpolation and adaptive background derived from the supplied Spatial Explainer reference. */
const ease = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

function lerpCam(a, b, p, fly) {
  const e = ease(Math.max(0, Math.min(1, p)));
  const x = a.x + (b.x - a.x) * e;
  const y = a.y + (b.y - a.y) * e;
  // Geometric interpolation for scale looks uniform to the eye
  let s = Math.exp(Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * e);
  if (fly) {
    // Gentle zoom-out arc midway through long flights
    const dip = Math.sin(e * Math.PI);
    s *= Math.exp(-0.55 * dip);
  }
  return { x, y, s };
}

function validBehaviour(b){

function validSource(s){

function validCommand(c){

function validResponseCommand(c){validCommand(c);check(c.command!=='data.fetch','Response cannot directly initiate a fetch');}
function validate(s){

let scene, nodes=new Map(), dom=new Map(), fired=new Set(), running=new Set(), inside=new Map(), requests=new Map(), generation=0, revision=0;

const bus=new EventTarget();

function abs(n){let x=n.x,y=n.y,hidden=!!n.hidden,p=n.parent;while(p){const b=nodes.get(p);x+=b.x;y+=b.y;hidden=hidden||!!b.hidden;p=b.parent;}return {...n,x,y,hidden};}
function baseScale(){return Math.max(.01,Math.min(innerWidth/1600,(innerHeight-68)/900)*.9)}

function fit(bounds){const w=Math.max(1,bounds.w),h=Math.max(1,bounds.h);return{x:bounds.x+w/2,y:bounds.y+h/2,s:Math.max(MIN_S,Math.min(MAX_S,Math.min((innerWidth-80)/w,(innerHeight-130)/h)/baseScale()))};}

function syncFollow(){ $('follow').textContent='Follow: '+(follow?'on':'off');$('follow').setAttribute('aria-pressed',String(follow)); }
function manual(){humanEpoch++;follow=false;syncFollow();flight=null;mapMode=false;cameraDirty=true;dirty=true;}
function userNav(c){humanEpoch++;mapMode=c.command==='camera.overview';flyTo(target(c),c.durationMs,"human");}
function automated(c,epoch){if(!follow||dragging||flight?.owner==="human"||epoch!==humanEpoch){status('Camera request skipped: human control');emit('camera.interrupted',{reason:'human-control'});return;}mapMode=c.command==='camera.overview';flyTo(target(c),c.durationMs);}
function element(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=String(text);return el;}
function display(n){let v=n;for(const q of n.variants||[])if(lastCam.s>=q.minZoom)v={...n,type:q.type,props:{...n.props,...q.props}};return v;}
function makeContent(n){const p=n.props,c=element('div','node-content');if(p.label)c.append(element('div','node-label',p.label));if(p.title)c.append(element('h2','node-title',p.title));if(p.text)c.append(element('p','node-text',p.text));

  if(n.type==='list'){const list=element('ul','node-list');for(const item of p.items||[])list.append(element('li','',typeof item==='string'?item:`${item.label}: ${item.value}`));c.append(list);}
  if(n.type==='chart'){const items=(p.items||[]).filter(obj),max=Math.max(1,...items.map(i=>i.value));const bars=element('div','chart');for(const i of items){const r=element('div','bar-row');r.append(element('span','bar-label',i.label));const track=element('div','bar-track'),bar=element('div','bar-value');bar.style.width=(i.value/max*100)+'%';track.append(bar);r.append(track,element('span','bar-number',i.value));bars.append(r);}c.append(bars);}

function render(){

  const depths=n=>{let d=0;while(n.parent){d++;n=nodes.get(n.parent);}return d};
  const sorted=[...nodes.values()].sort((a,b)=>depths(a)-depths(b));
  for(const n of sorted){const a=abs(n),v=display(n);let entry=dom.get(n.id);if(!entry){const el=element('section','node');el.dataset.id=n.id;el.tabIndex=0;el.addEventListener('click',e=>{if(e.target.closest('button, input, select, textarea, a'))return;if(mapMode){e.stopPropagation();userNav({command:'camera.focus',target:n.id});}else emit('widget.action',{target:n.id,name:'select'});});el.addEventListener('dblclick',e=>{if(!e.target.closest('button,input,select,textarea,a')){e.stopPropagation();userNav({command:'camera.focus',target:n.id});}});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target===el){e.stopPropagation();userNav({command:'camera.focus',target:n.id});}});world.append(el);entry={el,key:null};dom.set(n.id,entry);if(!reducedMotion.matches)el.animate([{opacity:0},{opacity:1}],{duration:500,easing:'ease-out'});}
    const {el}=entry;el.className='node '+(n.type==='board'?'board':'card')+(mapMode?' clickable':'');Object.assign(el.style,{left:a.x+'px',top:a.y+'px',width:n.w+'px',height:n.h+'px',zIndex:String(depths(n)*2+(n.type==='board'?0:1))});el.hidden=a.hidden;el.setAttribute('aria-label',v.props.title||n.id);

function evaluateCamera(){

  const active=new Set();for(const b of scene.behaviours){if(!b.on.event.startsWith('camera.'))continue;active.add(b.id);const n=nodes.get(b.on.target),a=n?abs(n):null;const yes=!!a&&!a.hidden&&lastCam.s>=(b.on.minZoom??MIN_S)&&Math.abs(a.x+a.w/2-lastCam.x)<=hw&&Math.abs(a.y+a.h/2-lastCam.y)<=hh;const old=inside.get(b.id)||false;inside.set(b.id,yes);if(yes!==old)emit(yes?'camera.enter':'camera.leave',{target:b.on.target,rule:b.id,zoom:lastCam.s});}

function getObj(s,id){const n=s.objects.find(n=>n.id===id);check(n,'Unknown object '+id);return n;}
function applyMutation(s,c){switch(c.command){
  case 'object.upsert':{const i=s.objects.findIndex(n=>n.id===c.object.id);if(i<0)s.objects.push(clone(c.object));else s.objects[i]=clone(c.object);break;}

  case 'object.move':{const n=getObj(s,c.target);n.x=c.x;n.y=c.y;if(own(c,'parent'))n.parent=c.parent;break;}
  case 'object.resize':{const n=getObj(s,c.target);n.w=c.w;n.h=c.h;break;}

function applyBatch(commands,{epoch=humanEpoch}={}){

async function dispatch(c,{epoch=humanEpoch}={}){validCommand(c);if(c.command==='data.fetch')return fetchSource(c.source,epoch);return applyBatch([c],{epoch});}
async function fetchSource(name,epoch){

function loadScene(input){const next=validate(clone(input));generation++;for(const r of requests.values())r.controller.abort();requests.clear();fired.clear();running.clear();inside.clear();scene=next;nodes=new Map(scene.objects.map(n=>[n.id,n]));revision=0;humanEpoch++;follow=true;syncFollow();flight=null;mapMode=scene.camera.initial==='overview';lastCam=mapMode?overview():target({command:'camera.focus',target:scene.camera.initial});dirty=true;cameraDirty=true;settleAt=performance.now()+150;status('Scene loaded');emit('scene.ready');}

$('map').onclick=()=>userNav({command:'camera.overview'});$('follow').onclick=()=>{follow=!follow;humanEpoch++;if(!follow&&flight?.owner!=="human"){flight=null;settleAt=performance.now()+100;}syncFollow();status(follow?'Automatic navigation enabled':'Human controls camera');};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const f=e.target.files[0];if(f){check(f.size<=1000000,'File too large');loadScene(JSON.parse(await f.text()));}}catch(err){status('Import rejected: '+err.message);}e.target.value='';};
$('reset').onclick=()=>loadScene(JSON.parse($('demo').textContent));

stage.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,input,select,textarea,a'))return;dragging={id:e.pointerId,x:e.clientX,y:e.clientY,c:{...lastCam},moved:false};});

function frame(pn){
